<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - MarketHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-main">
      <div class="container">
        <a href="index.html" class="logo">Market<span>Hub</span></a>
        <div class="header-actions">
          <a href="cart.html" class="header-action">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span>Cart</span>
            <span class="cart-badge" id="cartBadge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Product Details Section -->
  <section class="section">
    <div class="container">
      <div id="productDetail">
        <!-- Product details will be loaded here -->
      </div>

      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </section>

  <!-- Reviews Section -->
  <section class="section" style="background-color: var(--white);">
    <div class="container">
      <h2 class="section-title">Customer Reviews</h2>
      <div id="reviewsList">
        <!-- Reviews will be loaded here -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 MarketHub. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
