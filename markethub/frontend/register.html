<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MarketHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="card" style="max-width: 500px; width: 100%; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <h1 style="font-size: 28px; font-weight: 700; color: var(--primary-color);">Market<span>Hub</span></h1>
      <p style="color: var(--gray-600); margin-top: 8px;">Create your account</p>
    </div>

    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" required placeholder="First name">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" required placeholder="Last name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" required placeholder="Enter your phone number">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required placeholder="Create a password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" required placeholder="Confirm your password">
      </div>
      <div class="form-group">
        <label class="form-label">Register As</label>
        <select class="form-control" id="role">
          <option value="CUSTOMER">Customer</option>
          <option value="VENDOR">Vendor/Seller</option>
        </select>
      </div>
      <div style="margin-bottom: 24px;">
        <label style="display: flex; align-items: start; gap: 8px; font-size: 14px;">
          <input type="checkbox" required style="margin-top: 4px;">
          <span>I agree to the <a href="#" style="color: var(--primary-color);">Terms of Service</a> and <a href="#" style="color: var(--primary-color);">Privacy Policy</a></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary-colored" style="width: 100%;">Register</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--gray-200);">
      <p style="color: var(--gray-600);">Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Login</a></p>
    </div>

    <div id="alert" style="margin-top: 16px;"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
